<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>💖 Chúc Mừng 20/10 - Gửi Vợ & Con Gái Yêu 💖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;0,900;1,600&family=Dancing+Script:wght@600;700&family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Great+Vibes&display=swap&subset=vietnamese"
      rel="stylesheet"
    />
    <style>
      :root {
        --pink: #ff6fae;
        --rose: #ff3377;
        --gold: #ffd699;
        --purple: #9b51e0;
        --text: #fff5fa;
        --bg-dark: #1f0719;
        --serif: "Playfair Display", "Times New Roman", Georgia, serif;
        --script: "Dancing Script", cursive;
        --hand: "Great Vibes", cursive;
        --sans: "Be Vietnam Pro", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        background: radial-gradient(circle at 50% 25%, #421133 0%, #200619 65%, #11020d 100%);
        color: var(--text);
        font-family: var(--sans);
        user-select: none;
      }

      /* Glow background orbs */
      .glow {
        position: fixed;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.38;
        pointer-events: none;
        animation: floatOrb 14s ease-in-out infinite alternate;
        z-index: 0;
      }
      .g1 {
        width: 55vmax;
        height: 55vmax;
        background: radial-gradient(circle, #ff2a85, transparent 70%);
        left: -18vmax;
        top: -12vmax;
      }
      .g2 {
        width: 48vmax;
        height: 48vmax;
        background: radial-gradient(circle, #9333ea, transparent 70%);
        right: -15vmax;
        bottom: -12vmax;
        animation-delay: -7s;
      }
      .g3 {
        width: 35vmax;
        height: 35vmax;
        background: radial-gradient(circle, #ff758c, transparent 70%);
        left: 30%;
        top: 40%;
        opacity: 0.22;
        animation-duration: 18s;
      }
      @keyframes floatOrb {
        to {
          transform: translate(6vmax, 5vmax) scale(1.15);
          opacity: 0.52;
        }
      }

      /* Background Stars */
      .star {
        position: fixed;
        border-radius: 50%;
        pointer-events: none;
        z-index: 0;
        animation: twinkle 3.5s infinite alternate ease-in-out;
      }
      .star.glint {
        border-radius: 0;
        clip-path: polygon(50% 0%, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0% 50%, 38% 38%);
        animation: glintPulse 2.8s infinite ease-in-out;
      }
      @keyframes twinkle {
        from { opacity: 0.15; transform: scale(0.8); }
        to { opacity: 0.95; transform: scale(1.2); box-shadow: 0 0 10px #fff; }
      }
      @keyframes glintPulse {
        0%, 100% { opacity: 0.2; transform: scale(0.6) rotate(0deg); }
        50% { opacity: 1; transform: scale(1.25) rotate(45deg); }
      }

      /* STAGE 1: Decoding intro screen */
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.2rem;
        z-index: 10;
        transition: opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1), transform 0.9s ease;
        padding: 1.5rem;
        text-align: center;
      }
      #stage.hide {
        opacity: 0;
        transform: scale(0.9);
        pointer-events: none;
      }

      .line {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        font-family: var(--serif);
        font-weight: 900;
        line-height: 1.15;
      }
      .l1 {
        font-size: clamp(2rem, 7vw, 4.2rem);
        color: #ffffff;
        text-shadow: 0 0 30px rgba(255, 182, 213, 0.5), 0 0 60px rgba(255, 105, 180, 0.3);
        letter-spacing: 2px;
      }
      .l2 {
        font-size: clamp(2.4rem, 10vw, 5.5rem);
        background: linear-gradient(135deg, #ffd9a8, #ff6fae, #ff2a85);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 35px rgba(255, 42, 133, 0.6);
        animation: titleGlow 3s ease-in-out infinite alternate;
      }
      @keyframes titleGlow {
        to {
          filter: drop-shadow(0 0 25px rgba(255, 105, 180, 0.8));
          transform: scale(1.02);
        }
      }

      .slot {
        display: inline-block;
        opacity: 0;
        min-width: 0.05em;
      }
      .slot.sp { min-width: 0.38em; }
      .slot.ok {
        opacity: 1;
        animation: pop 0.55s ease-out;
      }
      @keyframes pop {
        0% { transform: scale(1.8); filter: brightness(2.5); }
        100% { transform: none; filter: none; }
      }

      .fly {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 12;
        pointer-events: none;
        font-family: var(--serif);
        font-weight: 900;
        color: #ffb3d4;
        text-shadow: 0 0 16px var(--rose);
        will-change: transform;
        transition: opacity 0.8s;
      }

      #hint {
        font-family: var(--script);
        font-size: clamp(1.4rem, 4vw, 1.9rem);
        color: var(--gold);
        animation: pulse 1.8s infinite;
        text-shadow: 0 0 12px rgba(255, 214, 153, 0.6);
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.7; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1.04); }
      }

      .btn-magic {
        padding: 0.95rem 2.4rem;
        border: none;
        border-radius: 999px;
        font: 700 1.15rem var(--sans);
        color: #fff;
        cursor: pointer;
        background: linear-gradient(135deg, #ff4d8d, #ff1a6c, #e024c3);
        background-size: 200% 200%;
        box-shadow: 0 0 35px rgba(255, 26, 108, 0.65), 0 8px 24px rgba(0, 0, 0, 0.4);
        transition: transform 0.25s, box-shadow 0.25s;
        animation: gradientShift 4s ease infinite;
      }
      .btn-magic:hover {
        transform: scale(1.08) translateY(-2px);
        box-shadow: 0 0 50px rgba(255, 26, 108, 0.85);
      }
      @keyframes gradientShift {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
      }

      /* STAGE 2: Main Card Container */
      #card {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 1.2rem 0.8rem 2.5rem;
        z-index: 5;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }
      #card.show {
        opacity: 1;
        pointer-events: auto;
      }

      /* Scrollbar styling */
      #card::-webkit-scrollbar { width: 6px; }
      #card::-webkit-scrollbar-thumb {
        background: rgba(255, 111, 174, 0.4);
        border-radius: 10px;
      }

      .box {
        position: relative;
        margin: auto;
        max-width: 540px;
        width: 100%;
        text-align: center;
        padding: 2.2rem 1.6rem 2rem;
        border-radius: 30px;
        background: linear-gradient(
          165deg,
          rgba(255, 255, 255, 0.16) 0%,
          rgba(255, 255, 255, 0.05) 50%,
          rgba(255, 111, 174, 0.08) 100%
        );
        border: 1px solid rgba(255, 200, 225, 0.4);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow:
          0 30px 100px rgba(0, 0, 0, 0.6),
          0 15px 45px rgba(255, 42, 133, 0.35),
          inset 0 0 35px rgba(255, 255, 255, 0.12);
        transform: scale(0.9) translateY(40px);
        transition: transform 1.2s cubic-bezier(0.2, 1.2, 0.3, 1);
      }
      #card.show .box {
        transform: none;
      }

      /* Shimmer sweep over glass card */
      .box::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(
          120deg,
          transparent 30%,
          rgba(255, 255, 255, 0.15) 50%,
          transparent 70%
        );
        background-size: 250% 250%;
        animation: glassSweep 9s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes glassSweep {
        0%, 100% { background-position: -100% -100%; }
        50% { background-position: 200% 200%; }
      }

      .badge {
        display: inline-block;
        padding: 0.32rem 1.1rem;
        border-radius: 999px;
        font-size: 0.72rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #3b0928;
        font-weight: 700;
        background: linear-gradient(90deg, #ffd9a8, #ffb3d4, #ffd9a8);
        background-size: 200% 100%;
        box-shadow: 0 0 24px rgba(255, 217, 168, 0.6);
        animation: badgeGlow 4s linear infinite;
      }
      @keyframes badgeGlow {
        0% { background-position: 0% 0%; }
        100% { background-position: 200% 0%; }
      }

      .heart-icon {
        font-size: 2.4rem;
        margin: 0.6rem 0 0.3rem;
        display: inline-block;
        animation: heartBeat 1.3s ease-in-out infinite;
        filter: drop-shadow(0 0 15px rgba(255, 51, 119, 0.8));
      }
      @keyframes heartBeat {
        0%, 100% { transform: scale(1); }
        14% { transform: scale(1.22); }
        28% { transform: scale(1); }
        42% { transform: scale(1.18); }
      }

      /* Photo Gallery - Highlighting both Mom & Daughter */
      .photos-grid {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.85rem;
        width: 100%;
        margin: 1rem 0 1.2rem;
        perspective: 900px;
      }
      .photo-card {
        position: relative;
        border-radius: 18px;
        overflow: hidden;
        border: 3px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4), 0 0 20px rgba(255, 105, 180, 0.35);
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
        background: #2a0b22;
      }
      .photo-card:first-child {
        transform: rotate(-2.5deg);
      }
      .photo-card:last-child {
        transform: rotate(2.5deg);
      }
      .photo-card:hover {
        transform: translateY(-7px) rotate(0deg) scale(1.04);
        box-shadow: 0 18px 42px rgba(255, 42, 133, 0.55);
        z-index: 2;
      }
      .photo-card img {
        width: 100%;
        height: 190px;
        object-fit: cover;
        display: block;
        transition: transform 0.5s ease;
      }
      .photo-card:hover img {
        transform: scale(1.06);
      }
      .photo-label {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 0.4rem 0.2rem;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.82), transparent);
        font-family: var(--script);
        font-size: 1.15rem;
        color: #ffd699;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
      }

      /* Recipient Tabs: Cả hai / Vợ yêu / Con yêu */
      .recipients-switch {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        margin: 1.1rem 0 0.8rem;
        background: rgba(0, 0, 0, 0.25);
        padding: 0.3rem;
        border-radius: 999px;
        border: 1px solid rgba(255, 182, 213, 0.3);
      }
      .tab-btn {
        padding: 0.45rem 1.1rem;
        border: none;
        border-radius: 999px;
        background: transparent;
        color: #ffcce0;
        font-family: var(--sans);
        font-size: 0.86rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      .tab-btn.active {
        background: linear-gradient(135deg, #ff4d8d, #ff1a6c);
        color: #ffffff;
        box-shadow: 0 4px 16px rgba(255, 26, 108, 0.5);
      }

      .t1 {
        font-family: var(--script);
        font-size: 1.35rem;
        color: var(--gold);
        margin: 0;
        letter-spacing: 0.5px;
      }
      .t2 {
        font-family: var(--serif);
        font-size: clamp(1.8rem, 6.5vw, 2.7rem);
        font-weight: 800;
        margin: 0.2rem 0 0.5rem;
        background: linear-gradient(90deg, #ff9ec8, #fff, #ffd9a8, #ff6fae, #ff9ec8);
        background-size: 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: textShine 6s linear infinite;
      }
      @keyframes textShine {
        to { background-position: -250% 0; }
      }

      .ornament {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        justify-content: center;
        color: var(--pink);
        margin: 0.5rem 0 1.1rem;
        font-size: 1rem;
      }
      .ornament::before,
      .ornament::after {
        content: "";
        height: 1px;
        width: 25%;
        background: linear-gradient(90deg, transparent, var(--pink));
      }
      .ornament::after {
        transform: scaleX(-1);
      }

      #msg {
        font-size: 0.96rem;
        line-height: 1.85;
        min-height: 5.8em;
        margin: 0 0.4rem;
        color: #fff1f6;
        font-weight: 400;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
        transition: opacity 0.4s ease;
      }

      /* Wishes cards grid */
      .wishes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.65rem;
        margin: 1.2rem 0;
      }
      .w {
        padding: 0.85rem 0.65rem;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 182, 213, 0.25);
        opacity: 0;
        transform: translateY(24px) scale(0.92);
        transition: all 0.7s cubic-bezier(0.2, 1.3, 0.3, 1);
        text-align: center;
      }
      .w.on {
        opacity: 1;
        transform: none;
      }
      .w:hover {
        background: rgba(255, 255, 255, 0.16);
        border-color: rgba(255, 182, 213, 0.6);
        box-shadow: 0 10px 28px rgba(255, 61, 132, 0.25);
        transform: translateY(-3px);
      }
      .w i {
        font-style: normal;
        font-size: 1.5rem;
        display: block;
        margin-bottom: 0.3rem;
      }
      .w.on i {
        animation: wishBounce 2.5s ease-in-out infinite;
      }
      .w:nth-child(even).on i {
        animation-delay: 1.25s;
      }
      @keyframes wishBounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px) scale(1.15); filter: drop-shadow(0 0 10px rgba(255, 214, 153, 0.9)); }
      }
      .w b {
        display: block;
        font-family: var(--serif);
        font-size: 0.9rem;
        color: #ffd699;
        margin-bottom: 0.25rem;
      }
      .w span {
        font-size: 0.74rem;
        font-weight: 300;
        opacity: 0.9;
        line-height: 1.45;
        display: block;
        color: #ffeff7;
      }

      .quote {
        font-family: var(--script);
        font-size: 1.28rem;
        color: var(--gold);
        line-height: 1.6;
        margin: 1rem 0 0.4rem;
        opacity: 0;
        transition: opacity 1.2s;
        text-shadow: 0 0 12px rgba(255, 214, 153, 0.5);
      }
      .sign {
        font-family: var(--hand);
        font-size: 2.1rem;
        color: #ff7bb0;
        margin: 0.2rem 0 0.8rem;
        opacity: 0;
        transition: opacity 1.2s;
        text-shadow: 0 0 20px rgba(255, 61, 132, 0.7);
      }
      .sign.on2 {
        opacity: 1;
        animation: signPulse 2.5s ease-in-out infinite alternate;
      }
      @keyframes signPulse {
        to {
          transform: scale(1.05);
          text-shadow: 0 0 25px rgba(255, 105, 180, 0.95);
        }
      }
      .on2 {
        opacity: 1;
      }

      /* Interactive buttons */
      .action-btns {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 1rem;
        opacity: 0;
        transition: opacity 1s;
      }
      .btn-action {
        padding: 0.7rem 1.4rem;
        border-radius: 999px;
        font: 600 0.9rem var(--sans);
        color: #fff;
        cursor: pointer;
        border: 1px solid rgba(255, 182, 213, 0.45);
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(10px);
        transition: all 0.25s ease;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .btn-action:hover {
        background: linear-gradient(135deg, #ff4d8d, #ff1a6c);
        border-color: transparent;
        transform: translateY(-2px) scale(1.04);
        box-shadow: 0 6px 20px rgba(255, 26, 108, 0.5);
      }

      .hint-footer {
        margin-top: 0.8rem;
        font-size: 0.74rem;
        opacity: 0.7;
        letter-spacing: 0.05em;
      }

      /* Floating Hearts and Fireworks */
      .heart {
        position: fixed;
        bottom: -50px;
        z-index: 2;
        pointer-events: none;
        animation: floatUp linear forwards;
        filter: drop-shadow(0 0 10px rgba(255, 51, 119, 0.8));
      }
      @keyframes floatUp {
        to {
          transform: translate(var(--dx), -115vh) rotate(var(--rot));
          opacity: 0;
        }
      }

      .burst {
        position: fixed;
        z-index: 99;
        pointer-events: none;
        animation: burstAnim 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
      }
      @keyframes burstAnim {
        to {
          transform: translate(var(--bx), var(--by)) scale(0.2);
          opacity: 0;
        }
      }

      /* Custom cursor trail */
      #cur {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 9999;
        pointer-events: none;
        font-size: 24px;
        color: #ff3d84;
        filter: drop-shadow(0 0 10px #ff3d84);
        opacity: 0;
        transition: opacity 0.3s;
        will-change: transform;
      }
      #cur span {
        display: inline-block;
        animation: heartBeat 1.2s infinite;
      }
      .trail {
        position: fixed;
        z-index: 9998;
        pointer-events: none;
        transform: translate(-50%, -50%);
        animation: trailFade 1.2s ease-out forwards;
        filter: drop-shadow(0 0 8px rgba(255, 61, 132, 0.8));
      }
      @keyframes trailFade {
        to {
          transform: translate(calc(-50% + var(--tx)), -80px) scale(0.35);
          opacity: 0;
        }
      }

      /* Music toggle button */
      .music-btn {
        position: fixed;
        top: 1.2rem;
        right: 1.2rem;
        z-index: 100;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid rgba(255, 182, 213, 0.4);
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(12px);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }
      .music-btn:hover {
        transform: scale(1.1);
        background: rgba(255, 255, 255, 0.28);
      }
      .music-btn.playing {
        animation: spinMusic 5s linear infinite;
      }
      @keyframes spinMusic {
        100% { transform: rotate(360deg); }
      }

      @media (max-width: 520px) {
        .box { padding: 1.6rem 1.1rem 1.5rem; }
        .photo-card img { height: 145px; }
        .wishes { grid-template-columns: 1fr; gap: 0.5rem; }
        .t2 { font-size: 1.9rem; }
      }
    </style>
  </head>
  <body>
    <!-- Ambient Background Glows -->
    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div class="glow g3"></div>

    <!-- Music Toggle -->
    <button class="music-btn" id="musicBtn" title="Bật/Tắt nhạc nhẹ">🎵</button>

    <!-- INTRO STAGE -->
    <div id="stage">
      <div class="line l1" id="l1"></div>
      <div class="line l2" id="l2"></div>
      <div id="hint">✦ Có những yêu thương ngọt ngào đang bay đến... ✦</div>
      <button class="btn-magic" id="btn">Mở quà tặng 20/10 💌</button>
    </div>

    <!-- MAIN CARD -->
    <div id="card">
      <div class="box">
        <span class="badge">20 · 10 &nbsp;Ngày Phụ Nữ Việt Nam</span>
        <div class="heart-icon">💖</div>

        <!-- 2 Ảnh kỷ niệm của Vợ & Con -->
        <div class="photos-grid" aria-label="Những khoảnh khắc hạnh phúc">
          <div class="photo-card">
            <img src="1.jpg" alt="Vợ yêu & Con gái" />
            <div class="photo-label">Mẹ & Con 🌸</div>
          </div>
          <div class="photo-card">
            <img src="2.jpg" alt="Cả gia đình nhỏ ấm áp" />
            <div class="photo-label">Gia đình mình 💖</div>
          </div>
        </div>

        <!-- Bộ chuyển đổi lời chúc: Cả hai / Vợ yêu / Con gái yêu -->
        <div class="recipients-switch">
          <button class="tab-btn active" onclick="switchTheme('both')">👨‍👩‍👧 Cả Hai Mẹ Con</button>
          <button class="tab-btn" onclick="switchTheme('wife')">👰 Gửi Vợ Yêu</button>
          <button class="tab-btn" onclick="switchTheme('daughter')">👧 Gửi Con Gái</button>
        </div>

        <p class="t1">Món quà đong đầy tình cảm gửi tới</p>
        <h1 class="t2" id="name">Hai Mẹ Con Yêu Quý</h1>
        <div class="ornament">❀ ❤ ❀</div>

        <div id="msg"></div>
        <div class="wishes" id="wishes"></div>
        <div class="quote" id="quote"></div>
        <div class="sign" id="sign">Yêu hai mẹ con nhiều nhất trần đời! 💖</div>

        <div class="action-btns" id="actionBtns">
          <button class="btn-action" onclick="heartStorm(35)">🌸 Thả Mưa Tim</button>
          <button class="btn-action" onclick="sparkleExplosion()">✨ Pháo Hoa Tình Yêu</button>
        </div>

        <div class="hint-footer">
          <small>Chạm vào màn hình hoặc bấm phím Space để thả ngập tràn tim yêu thương ♡</small>
        </div>
      </div>
    </div>

    <script>
      // Dữ liệu lời chúc dành riêng cho Vợ và Con
      const THEMES = {
        both: {
          title: "Hai Mẹ Con Yêu Quý",
          intro:
            "Nhân ngày Phụ nữ Việt Nam 20/10, chúc hai người phụ nữ tuyệt vời nhất trong cuộc đời anh/ba luôn rạng rỡ nụ cười, luôn xinh tươi, mạnh khỏe và ngập tràn hạnh phúc. Hai mẹ con chính là niềm tự hào, bình yên và là món quà vô giá của gia đình mình! 🌸💖",
          wishes: [
            ["🌸", "Luôn Xinh Tươi", "Rạng ngời như đóa hoa sớm mai, tươi tắn và tràn đầy năng lượng."],
            ["💖", "Đong Đầy Hạnh Phúc", "Mỗi ngày trôi qua đều là những khoảnh khắc ấm áp và bình yên."],
            ["🍀", "Vạn Sự Bình An", "Sức khỏe dồi dào, mọi điều may mắn và thuận lợi luôn cận kề."],
            ["✨", "Yêu Thương Trọn Vẹn", "Được yêu thương, chở che và nâng niu từng phút giây cuộc đời."]
          ],
          quote: "« Cảm ơn hai mẹ con đã đến bên ba/anh và biến mỗi ngày bình thường thành một ngày ngập tràn phép màu! »",
          sign: "Yêu hai mẹ con nhất trên đời 💖"
        },
        wife: {
          title: "Vợ Yêu Của Anh",
          intro:
            "Chúc mừng ngày 20/10 người phụ nữ anh yêu thương nhất! Cảm ơn em vì đã luôn dịu dàng, chu đáo chăm sóc tổ ấm nhỏ của chúng mình. Chúc em mãi xinh đẹp, trẻ trung, tự tin và luôn cảm nhận được tình yêu thương, sự trân trọng từ anh mỗi ngày! 🌹💍",
          wishes: [
            ["🌹", "Mãi Trẻ Đẹp", "Nhan sắc mãi đằm thắm, trẻ trung và nụ cười luôn tỏa sáng."],
            ["☕", "Bớt Chút Lo Toan", "Mỗi ngày đều nhẹ nhàng, có thêm thời gian yêu thương bản thân."],
            ["💎", "Trân Trọng & Nâng Niu", "Anh sẽ luôn là điểm tựa vững chãi, cùng em đi qua mọi tháng năm."],
            ["🎁", "Hạnh Phúc Ngập Tràn", "Mọi ước mơ nhỏ bé của em đều sẽ trở thành hiện thực."]
          ],
          quote: "« Cảm ơn vì em đã chọn đồng hành cùng anh và làm mẹ của con mình. Yêu em vô cùng! »",
          sign: "Chồng của em 💌"
        },
        daughter: {
          title: "Công Chúa Nhỏ Của Ba Mẹ",
          intro:
            "Chúc thiên thần bé bỏng của ba mẹ một ngày 20/10 thật vui vẻ, ngọt ngào! Chúc con gái luôn ngoan ngoãn, hồn nhiên, học giỏi và lớn lên trong tình yêu thương ấm áp của cả gia đình. Con mãi là niềm tự hào và niềm vui to lớn của ba mẹ! 👧🎀",
          wishes: [
            ["🎀", "Hồn Nhiên & Vui Tươi", "Tiếng cười trong trẻo của con luôn làm rực sáng cả ngôi nhà."],
            ["📚", "Học Rộng Biết Nhiều", "Mỗi ngày học thêm nhiều điều hay, luôn thông minh và tự tin."],
            ["🌈", "Nuôi Dưỡng Ước Mơ", "Mạnh dạn vươn tới những ước mơ tươi sáng nhất của con."],
            ["🧸", "Mãi Là Công Chúa Nhỏ", "Cả nhà sẽ luôn bên cạnh, che chở và tiếp thêm sức mạnh cho con."]
          ],
          quote: "« Con là bông hoa xinh đẹp và đáng yêu nhất trong khu vườn của gia đình ta! »",
          sign: "Ba mẹ yêu con rất nhiều! 💕"
        }
      };

      const CFG = {
        l1: "CHÚC MỪNG 20/10",
        l2: "VỢ & CON GÁI YÊU",
      };

      const POOL = "ABCDEFGHIKLMNOPQRSTUVXYĂÂÊÔƠƯ0123456789";
      const rnd = (a) =>
        Array.isArray(a) || typeof a === "string"
          ? a[Math.floor(Math.random() * a.length)]
          : 0;
      const R = (a, b) => Math.random() * (b - a) + a;
      const $ = (id) => document.getElementById(id);

      // Tạo sao nền lấp lánh
      for (let i = 0; i < 75; i++) {
        const s = document.createElement("div");
        s.className = "star";
        s.style.cssText = `left:${R(0, 100)}vw;top:${R(0, 100)}vh;width:${R(2, 4)}px;height:${R(2, 4)}px;animation-delay:${R(0, 3.5)}s;background:${rnd(["#fff", "#ffd699", "#ffb3d4", "#fbcfe8"])}`;
        document.body.appendChild(s);
      }
      for (let i = 0; i < 30; i++) {
        const s = document.createElement("div");
        s.className = "star glint";
        s.style.cssText = `left:${R(3, 97)}vw;top:${R(4, 96)}vh;width:${R(7, 14)}px;height:${R(7, 14)}px;animation-delay:${R(0, 2.8)}s;background:${rnd(["#fff", "#ffd699", "#ffb3d4"])}`;
        document.body.appendChild(s);
      }

      // Xây dựng chữ bay giải mã
      const flyers = [];
      let W = innerWidth,
        H = innerHeight,
        decoding = false,
        landed = 0,
        total = 0;

      function build(el, text, cls) {
        [...text].forEach((c) => {
          const s = document.createElement("span");
          s.className = "slot" + (c === " " ? " sp" : "");
          s.textContent = c === " " ? "\u00a0" : c;
          el.appendChild(s);
          if (c !== " ") flyers.push({ slot: s, c, cls, real: true });
        });
      }
      build($("l1"), CFG.l1, "l1");
      build($("l2"), CFG.l2, "l2");
      total = flyers.length;

      function init() {
        flyers.forEach((f) =>
          mk(f, parseFloat(getComputedStyle(f.slot).fontSize) || 36)
        );
        for (let i = 0; i < 38; i++) {
          const f = { real: false, c: "", cls: "" };
          flyers.push(f);
          mk(f, R(20, 52));
        }
        requestAnimationFrame(tick);
      }

      function mk(f, size) {
        const e = document.createElement("div");
        e.className = "fly";
        e.style.fontSize = size + "px";
        e.style.opacity = f.real ? 1 : 0.6;
        e.style.color = rnd(["#ffb3d4", "#ff6fae", "#ffd699", "#f472b6", "#fff"]);
        e.textContent = rnd(POOL);
        document.body.appendChild(e);
        Object.assign(f, {
          el: e,
          x: R(0, W),
          y: R(0, H),
          vx: R(-2.8, 2.8),
          vy: R(-2.8, 2.8),
          rot: R(0, 360),
          vr: R(-4.5, 4.5),
          t: R(0, 6),
          sc: 1,
          state: "fly",
        });
      }

      function tick() {
        flyers.forEach((f) => {
          if (f.state === "done" || !f.el) return;
          if (f.state === "fly") {
            f.vx += R(-0.14, 0.14);
            f.vy += R(-0.14, 0.14);
            const m = Math.hypot(f.vx, f.vy),
              mx = 3.5;
            if (m > mx) {
              f.vx *= mx / m;
              f.vy *= mx / m;
            }
            f.x += f.vx;
            f.y += f.vy;
            f.rot += f.vr;
            f.t += 0.04;
            f.sc = 1 + Math.sin(f.t) * 0.35;
            if (f.x < 0 || f.x > W) f.vx *= -1;
            if (f.y < 0 || f.y > H) f.vy *= -1;
            f.x = Math.max(-10, Math.min(W + 10, f.x));
            f.y = Math.max(-10, Math.min(H + 10, f.y));
          } else {
            const k = 0.08;
            f.x += (f.tx - f.x) * k;
            f.y += (f.ty - f.y) * k;
            f.rot += (0 - f.rot) * k;
            f.sc += (1 - f.sc) * k;
            if (Math.hypot(f.tx - f.x, f.ty - f.y) < 1.3 && Math.abs(f.rot) < 1) {
              land(f);
            }
          }
          f.el.style.transform = `translate(${f.x}px,${f.y}px) translate(-50%,-50%) rotate(${f.rot}deg) scale(${f.sc})`;
        });
        requestAnimationFrame(tick);
      }

      function land(f) {
        f.state = "done";
        f.el.remove();
        f.slot.classList.add("ok");
        sparkle(f.slot);
        if (++landed === total) {
          $("hint").textContent = "💖 Giải mã thành công những lời yêu thương 💖";
          heartStorm(30);
          setTimeout(showCard, 1600);
        }
      }

      setInterval(() => {
        flyers.forEach((f) => {
          if (f.el && f.state !== "done" && Math.random() < 0.4) {
            f.el.textContent = rnd(POOL);
          }
        });
      }, 150);

      function decode() {
        if (decoding) return;
        decoding = true;
        playBgm();
        $("btn").style.display = "none";
        $("hint").textContent = "Những dòng yêu thương đang tìm về vị trí... ✨";
        let i = 0;
        flyers.forEach((f) => {
          if (f.real) {
            setTimeout(() => {
              const r = f.slot.getBoundingClientRect();
              f.tx = r.left + r.width / 2;
              f.ty = r.top + r.height / 2;
              f.rot = (((f.rot % 360) + 540) % 360) - 180;
              f.state = "go";
              f.el.textContent = f.c;
            }, 500 + i++ * 120);
          } else {
            setTimeout(() => {
              f.el.style.opacity = 0;
            }, 400 + R(0, 1400));
            setTimeout(() => {
              f.state = "done";
              f.el.remove();
            }, 2400);
          }
        });
      }

      $("btn").onclick = decode;
      $("stage").addEventListener("click", (e) => {
        if (e.target.id !== "btn") decode();
      });

      addEventListener("resize", () => {
        W = innerWidth;
        H = innerHeight;
      });

      (document.fonts && document.fonts.ready
        ? document.fonts.ready
        : Promise.resolve()
      ).then(init);

      function sparkle(el) {
        const r = el.getBoundingClientRect();
        for (let i = 0; i < 4; i++) {
          burst(r.left + r.width / 2, r.top + r.height / 2, "✦", 12);
        }
      }

      function burst(x, y, ch, size) {
        const b = document.createElement("div");
        b.className = "burst";
        b.textContent = ch;
        b.style.cssText += `left:${x}px;top:${y}px;font-size:${size + R(0, 12)}px;color:#ffd699;--bx:${R(-80, 80)}px;--by:${R(-80, 80)}px`;
        document.body.appendChild(b);
        setTimeout(() => b.remove(), 1000);
      }

      const HEARTS = ["❤", "💖", "💗", "💕", "💘", "🌸", "🌹", "💝", "✨", "🌷"];
      function heart() {
        const h = document.createElement("div");
        h.className = "heart";
        h.textContent = rnd(HEARTS);
        const d = R(5.5, 11);
        h.style.cssText += `left:${R(0, 100)}vw;font-size:${R(18, 44)}px;animation-duration:${d}s;--dx:${R(-90, 90)}px;--rot:${R(-50, 50)}deg;opacity:${R(0.65, 1)}`;
        document.body.appendChild(h);
        setTimeout(() => h.remove(), d * 1000);
      }

      function heartStorm(count = 35) {
        for (let i = 0; i < count; i++) {
          setTimeout(heart, i * 50);
        }
      }

      function sparkleExplosion() {
        const cx = innerWidth / 2;
        const cy = innerHeight / 2;
        for (let i = 0; i < 30; i++) {
          setTimeout(() => {
            burst(cx + R(-160, 160), cy + R(-160, 160), rnd(HEARTS), R(20, 36));
          }, i * 30);
        }
        heartStorm(20);
      }

      // Hiện Card và hiệu ứng gõ chữ
      let typingTimer = null;
      function showCard() {
        $("stage").classList.add("hide");
        $("card").classList.add("show");
        setInterval(heart, 320);
        heartStorm(30);
        applyTheme("both");
      }

      function applyTheme(themeKey) {
        const data = THEMES[themeKey];
        $("name").textContent = data.title;
        $("sign").textContent = data.sign;
        $("quote").textContent = data.quote;

        // Render wishes
        $("wishes").innerHTML = data.wishes
          .map(
            (w) =>
              `<div class="w"><i>${w[0]}</i><b>${w[1]}</b><span>${w[2]}</span></div>`
          )
          .join("");

        // Typing effect
        if (typingTimer) clearTimeout(typingTimer);
        $("msg").textContent = "";
        let i = 0;
        function type() {
          $("msg").textContent = data.intro.slice(0, ++i);
          if (i < data.intro.length) {
            typingTimer = setTimeout(type, 30);
          } else {
            document.querySelectorAll(".w").forEach((w, k) => {
              setTimeout(() => w.classList.add("on"), k * 200);
            });
            setTimeout(() => $("quote").classList.add("on2"), 1000);
            setTimeout(() => $("sign").classList.add("on2"), 1600);
            setTimeout(() => ($("actionBtns").style.opacity = 1), 2000);
          }
        }
        type();
      }

      function switchTheme(key) {
        document.querySelectorAll(".tab-btn").forEach((btn) => btn.classList.remove("active"));
        if (event && event.target) event.target.classList.add("active");
        applyTheme(key);
        sparkleExplosion();
      }

      // Phím tắt Spacebar
      addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          if (!decoding) decode();
          else heartStorm(20);
        }
      });

      // Hiệu ứng di chuột tạo trái tim
      const cur = document.createElement("div");
      cur.id = "cur";
      cur.innerHTML = "<span>❤</span>";
      document.body.appendChild(cur);

      let lastTrailTime = 0;
      addEventListener("pointermove", (e) => {
        cur.style.transform = `translate(${e.clientX}px,${e.clientY}px) translate(-50%,-50%)`;
        cur.style.opacity = 1;
        const now = performance.now();
        if (now - lastTrailTime < 45) return;
        lastTrailTime = now;
        const t = document.createElement("div");
        t.className = "trail";
        t.textContent = rnd(["❤", "💖", "🌸", "💕", "✨"]);
        t.style.cssText += `left:${e.clientX}px;top:${e.clientY}px;font-size:${R(12, 22)}px;--tx:${R(-35, 35)}px`;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 1200);
      });
      document.addEventListener("mouseleave", () => (cur.style.opacity = 0));

      $("card").addEventListener("click", (e) => {
        if (!e.target.closest("button")) {
          for (let i = 0; i < 6; i++) {
            burst(e.clientX, e.clientY, rnd(HEARTS), 20);
          }
        }
      });

      // Nhạc nền du dương dùng Web Audio API (không phụ thuộc file ngoài)
      let audioCtx = null;
      let isMusicPlaying = false;
      let melodyInterval = null;

      function playBgm() {
        if (isMusicPlaying) return;
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          isMusicPlaying = true;
          $("musicBtn").classList.add("playing");

          // Chuỗi giai điệu tình cảm nhẹ nhàng (Pentatonic Romantic Melody)
          const notes = [
            261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25
          ];
          const melody = [
            0, 2, 4, 7, 4, 2, 0, 4, 5, 4, 2, 0, 2, 4, 7, 8, 7, 4, 2, 0
          ];
          let step = 0;

          melodyInterval = setInterval(() => {
            if (!isMusicPlaying || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const noteIdx = melody[step % melody.length];
            const freq = notes[noteIdx % notes.length];

            osc.type = "sine";
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.05, audioCtx.currentTime + 0.15);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 1.3);
            step++;
          }, 450);
        } catch (err) {
          console.log("Audio not allowed yet:", err);
        }
      }

      function toggleMusic() {
        if (!audioCtx) {
          playBgm();
          return;
        }
        if (isMusicPlaying) {
          isMusicPlaying = false;
          clearInterval(melodyInterval);
          $("musicBtn").classList.remove("playing");
        } else {
          isMusicPlaying = true;
          playBgm();
        }
      }

      $("musicBtn").onclick = toggleMusic;
    </script>
  </body>
</html>
